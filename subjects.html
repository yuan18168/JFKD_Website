<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>科目對照表｜【JFKD】家規獎懲系統</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">JF</div>
        <div class="brand-text">
          <div class="title">JFKD 家規獎懲</div>
          <div class="subtitle">家庭儀表板</div>
        </div>
      </div>

      <a href="index.html" class="nav-link">🏠 總覽</a>

      <div class="nav-section-label">學生</div>
      <div id="studentNavLinks"><div class="text-faint" style="padding:8px 12px;font-size:12px;">載入中...</div></div>

      <div class="nav-section-label">管理</div>
      <a href="config.html" class="nav-link">⚙️ 獎懲規則設定</a>
      <a href="subjects.html" class="nav-link active">📚 科目對照表</a>

      <div class="sidebar-footer">
        <img id="sidebarUserAvatar" src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="" />
        <span class="user-email" id="sidebarUserEmail">載入中...</span>
        <button id="logoutBtn">登出</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>科目對照表</h1>
          <div class="desc">
            設定每個年級固定會考的科目與順序（上下學期共用同一份）。新增考試紀錄時，選定學制／學期後會自動帶出這裡設定的科目，只需要回填分數；沒有設定的年級仍維持自由輸入科目的方式。
          </div>
        </div>
      </div>

      <div id="presetGroups"></div>

      <div style="margin-top:22px; display:flex; gap:10px; align-items:center;">
        <button class="btn btn-primary" id="saveSubjectPresetsBtn">儲存科目對照表</button>
        <span id="saveSubjectMsg" class="text-faint" style="font-size:12px;"></span>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/subjects.js"></script>
</body>
</html>
