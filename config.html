<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>獎懲規則設定｜【JFKD】成績記錄表</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1120" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=20260729j" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="images/jfkd-logo.png" alt="JFKD"></div>
        <div class="brand-text">
          <div class="title">JFKD 成績記錄表</div>
          <div class="subtitle">家庭儀表板</div>
        </div>
      </div>

      <a href="index.html" class="nav-link">🏠 總覽</a>

      <div class="nav-section-label">學生</div>
      <div id="studentNavLinks"><div class="text-faint" style="padding:8px 12px;font-size:12px;">載入中...</div></div>

      <div class="nav-section-label">學生管理</div>
      <a href="wishlist.html" class="nav-link">🎁 願望清單</a>
      <a href="themes.html" class="nav-link">🎨 主題造型</a>

      <div class="nav-section-label">父母管理</div>
      <a href="students.html" class="nav-link">👤 學生名單</a>
      <a href="config.html" class="nav-link active">⚙️ 獎懲規則設定</a>
      <a href="subjects.html" class="nav-link">📚 科目對照表</a>
      <a href="chart-settings.html" class="nav-link">📈 圖表顯示設定</a>
      <a href="effects.html" class="nav-link">✨ 特效設定</a>
      <a href="simulate.html" class="nav-link">🧮 試算表</a>

      <div class="sidebar-footer">
        <img id="sidebarUserAvatar" src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="" />
        <span class="user-email" id="sidebarUserEmail">載入中...</span>
        <button id="logoutBtn">登出</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>獎懲規則設定</h1>
          <div class="desc">可建立多個設定檔；每筆考試紀錄會記住當初套用的設定檔，之後新增其他設定檔不會連動更改舊紀錄</div>
        </div>
      </div>

      <div class="section-title mt-0">設定檔</div>
      <div class="card">
        <div id="profileChips" class="chip-row" style="margin-bottom:14px;"></div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input type="text" id="newProfileName" placeholder="輸入新設定檔名稱" style="max-width:220px;" />
          <button class="btn btn-primary" id="addProfileBtn">＋ 新增設定檔（複製目前內容）</button>
          <button class="btn" id="setDefaultProfileBtn">設為家庭預設</button>
          <button class="btn btn-danger" id="deleteProfileBtn">刪除此設定檔</button>
        </div>
        <div class="text-faint" id="profileHint" style="font-size:12px; margin-top:10px;"></div>
      </div>

      <div class="section-title">
        成績級距與獎金
        <span class="text-faint" style="text-transform:none; font-weight:400; letter-spacing:normal;">－ 正在編輯：<span id="editingProfileName">-</span></span>
      </div>
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="table-wrap">
          <table id="tiersTable">
            <thead>
              <tr>
                <th>級距</th><th>分數範圍</th><th class="num">基礎獎金</th><th class="num">衛冕獎金</th><th>需處罰</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-cols-2" style="margin-top:18px;">
        <div class="card">
          <div class="section-title mt-0">進步獎金</div>
          <label>每進步 1 分，加發（元）</label>
          <input type="number" id="progressPerPoint" />
        </div>
        <div class="card">
          <div class="section-title mt-0">處罰機制說明</div>
          <textarea id="punishmentText" rows="3" style="width:100%; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:9px 11px; font-family:inherit; font-size:13px;"></textarea>
        </div>
      </div>

      <div class="section-title">全科加碼獎金</div>
      <div class="grid grid-cols-2">
        <div class="card">
          <div class="section-title mt-0">3 科組合（全部達到同一級距時）</div>
          <div id="combo3Rows"></div>
        </div>
        <div class="card">
          <div class="section-title mt-0">5 科組合（全部達到同一級距時）</div>
          <div id="combo5Rows"></div>
        </div>
      </div>

      <div style="margin-top:22px; display:flex; gap:10px;">
        <button class="btn btn-primary" id="saveRulesBtn">儲存這個設定檔</button>
        <span id="saveMsg" class="text-faint" style="align-self:center; font-size:12px;"></span>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260729j"></script>
  <script src="js/auth.js?v=20260729j"></script>
  <script src="js/calc.js?v=20260729j"></script>
  <script src="js/data.js?v=20260729j"></script>
  <script src="js/nav.js?v=20260729j"></script>
  <script src="js/config.js?v=20260729j"></script>
</body>
</html>
