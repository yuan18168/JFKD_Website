      <div class="topbar">
        <div>
          <h1>特效設定</h1>
          <div class="desc">
            設定學生紀錄頁「科目成績趨勢」卡片的華麗特效。四條規則彼此互斥，判斷優先順序：
            最新一次滿分100 ＞ 進步＋衛冕 ＞ 衛冕 ＞ 進步（同時符合多項時，只播最高優先的那一條）。
            每條規則可各自選用素材庫裡的任一種特效、設定播放秒數、以及要用滑鼠移入還是點擊來觸發。
            播放中若使用者點擊畫面其它地方，特效會立即中止（只是把滑鼠移開不會中止）。
          </div>
        </div>
      </div>

      <div class="section-title mt-0">四條觸發規則</div>
