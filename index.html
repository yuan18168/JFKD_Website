<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>總覽｜【JFKD】成績記錄表</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">JF</div>
        <div class="brand-text">
          <div class="title">JFKD 成績記錄表</div>
          <div class="subtitle">家庭儀表板</div>
        </div>
      </div>

      <a href="index.html" class="nav-link active">🏠 總覽</a>

      <div class="nav-section-label">學生</div>
      <div id="studentNavLinks"><div class="text-faint" style="padding:8px 12px;font-size:12px;">載入中...</div></div>

      <div class="nav-section-label">管理</div>
      <a href="config.html" class="nav-link">⚙️ 獎懲規則設定</a>
      <a href="students.html" class="nav-link">👤 學生名單</a>
      <a href="subjects.html" class="nav-link">📚 科目對照表</a>
      <a href="simulate.html" class="nav-link">🧮 試算表</a>
      <a href="chart-settings.html" class="nav-link">📈 圖表顯示設定</a>
      <a href="themes.html" class="nav-link">🎨 學生主題造型</a>

      <div class="sidebar-footer">
        <img id="sidebarUserAvatar" src="https://api.dicebear.com/7.x/initials/svg?seed=U" alt="" />
        <span class="user-email" id="sidebarUserEmail">載入中...</span>
        <button id="logoutBtn">登出</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <div class="editable-title-row">
            <h1 id="dashboardTitle">JFKD Family 成績記錄表</h1>
            <button type="button" class="title-edit-btn" id="editTitleBtn" title="編輯標題">✏️</button>
          </div>
          <div class="desc">獎懲累計狀態總覽</div>
        </div>
      </div>

      <div class="grid grid-cols-4" id="statCards">
        <div class="card stat-card"><div class="label">學生人數</div><div class="value">–</div></div>
        <div class="card stat-card"><div class="label">累計紀錄數</div><div class="value">–</div></div>
        <div class="card stat-card"><div class="label">累計獎金</div><div class="value">–</div></div>
        <div class="card stat-card"><div class="label">待處理項目</div><div class="value">–</div></div>
      </div>

      <div class="section-title">依學生查看</div>
      <div class="grid grid-cols-3" id="studentCards">
        <div class="empty-state">載入中...</div>
      </div>

      <div class="section-title">最新紀錄</div>
      <div id="recentByStudent"><div class="empty-state">載入中...</div></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
